services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
      POSTGRES_DB: lore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./server/public:/app/public
    environment:
      DATABASE_URL: postgres://lore:lore@postgres:5432/lore
      PORT: 3000
      MCP_API_KEY: ${MCP_API_KEY:-dev-key}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-small}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
